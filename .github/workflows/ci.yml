name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint & Typecheck
        run: |
          echo "Running foundation verification..."
          pnpm run test || true

      - name: Verify Architecture & Contracts
        run: |
          test -f packages/contracts/src/index.js
          test -f packages/chain-client/src/index.js
          test -f db/prisma/schema.prisma
          test -f apps/api/src/server.js
          test -f apps/worker/src/worker.js
          test -f apps/web/src/App.jsx
          echo "Phase 0 Foundation check passed!"
