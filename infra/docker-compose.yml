version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: rwa-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rwa-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: rwa-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CHAIN_GATEWAY_MODE=mock
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: rwa-worker
    restart: always
    environment:
      - NODE_ENV=production
      - CHAIN_GATEWAY_MODE=mock
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: rwa-web
    restart: always
    ports:
      - "5173:80"

volumes:
  redisdata:
  miniodata:
